include: package:very_good_analysis/analysis_options.yaml
analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    [
      '**/**.g.dart',
      '**/**gr.dart',
      '**/**.freezed.dart',
      'lib/l10n/gen/*',
      'build/**',
      # Testing is ignored on this project (see CLAUDE.md). The test code is
      # kept for reference but excluded from analysis so stale tests never
      # break the build.
      'test/**',
    ]
linter:
  rules:
    sort_pub_dependencies: false
    sort_constructors_first: false
    document_ignores: false
    public_member_api_docs: false
