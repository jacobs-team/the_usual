name: the_usual
description: Meal and calorie tracker.
version: 1.0.0+2
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  connectivity_plus: ^7.1.1
  dio: ^5.9.1
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  hydrated_bloc: ^11.0.0
  injectable: ^3.0.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path_provider: ^2.1.5
  pretty_dio_logger: ^1.4.0
  uuid: ^4.5.1
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  permission_handler: ^12.0.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  flutter_gen_runner: ^5.14.1
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  freezed: ^3.2.3
  go_router_builder: ^4.3.0
  injectable_generator: ^3.0.2
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    
flutter_gen:
  integrations:
    flutter_svg: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/icon.png
  android_12:
    image: assets/icon/icon.png
    color: "#ffffff"
