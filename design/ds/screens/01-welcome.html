<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#2F7A55;--tint:#E8F3EC;--ink:#1A1D1B;--sub:#6B7280;--line:#E5E7E3;--surf:#F4F5F3}
*{margin:0;box-sizing:border-box;font-family:'Inter',-apple-system,system-ui,sans-serif}
body{background:#ECEEEC;display:flex;justify-content:center;padding:24px}
.phone{width:390px;height:844px;background:#fff;border-radius:24px;padding:64px 24px 32px;display:flex;flex-direction:column;gap:20px}
.wordmark{font-size:17px;font-weight:600;color:var(--accent)}
.spacer{flex:1}
h1{font-size:32px;font-weight:700;color:var(--ink);line-height:1.2}
.sub{font-size:16px;color:var(--sub);line-height:1.45}
.card{background:var(--surf);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card b{font-size:16px;font-weight:600;color:var(--ink)}
.chips{display:flex;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:#fff;font-size:14px;font-weight:500;color:var(--ink);border:1px solid var(--line)}
.chip.sel{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.btn{display:flex;justify-content:center;padding:16px;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
.cap{font-size:13px;color:var(--sub);text-align:center}
</style></head><body><div class="phone">
<div class="wordmark">The Usual</div>
<div class="spacer"></div>
<h1>Track what you eat in two taps.</h1>
<p class="sub">Set up your usual meals once and logging takes seconds.</p>
<div class="card"><b>Did you eat lunch today?</b>
<div class="chips"><span class="chip sel">Chicken bowl</span><span class="chip">Leftovers</span><span class="chip">+ Else</span></div>
</div>
<div class="spacer"></div>
<div class="btn">Get started</div>
<p class="cap">No account needed. Your data stays on your phone.</p>
</div></body></html>
