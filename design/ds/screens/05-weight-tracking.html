<!-- @dsCard group="Onboarding" name="05 · Weight tracking" subtitle="Cadence, time of day, starting weight" width="440" height="900" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#2F7A55;--tint:#E8F3EC;--ink:#1A1D1B;--sub:#6B7280;--line:#E5E7E3;--surf:#F4F5F3}
*{margin:0;box-sizing:border-box;font-family:'Inter',-apple-system,system-ui,sans-serif}
body{background:#ECEEEC;display:flex;justify-content:center;padding:24px}
.phone{width:390px;height:844px;background:#fff;border-radius:24px;padding:64px 24px 32px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}.dot.on{background:var(--accent)}
.skip{font-size:15px;font-weight:500;color:var(--sub)}
h1{font-size:26px;font-weight:700;color:var(--ink)}
.sub{font-size:15px;color:var(--sub);line-height:1.4}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--sub)}
.seg{display:flex;background:var(--surf);border-radius:12px;padding:4px;gap:4px}
.seg div{flex:1;text-align:center;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--sub)}
.seg .on{background:#fff;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;background:var(--surf);font-size:14px;font-weight:500;color:var(--ink)}
.chip.sel{background:var(--tint);border:1px solid var(--accent);color:var(--accent)}
.note{font-size:13px;color:var(--sub)}
.weight{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:18px 18px 18px 20px}
.weight b{flex:1;font-size:34px;font-weight:700;color:var(--ink)}
.units{display:flex;background:var(--surf);border-radius:9px;padding:3px;gap:2px}
.units span{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--sub)}
.units .on{background:#fff;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spacer{flex:1}
.btn{display:flex;justify-content:center;padding:16px;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
</style></head><body><div class="phone">
<div class="topbar"><span>←</span><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot on"></span><span class="dot"></span></div><span class="skip">Skip</span></div>
<h1>Weight check-ins</h1>
<p class="sub">A quick weigh-in keeps the trend honest.</p>
<p class="lbl">HOW OFTEN</p>
<div class="seg"><div class="on">Daily</div><div>Every 2 days</div><div>Weekly</div></div>
<p class="lbl">WHAT TIME OF DAY</p>
<div class="chips"><span class="chip sel">Morning · recommended</span><span class="chip">Evening</span><span class="chip">Night</span></div>
<p class="note">Morning weigh-ins are the most consistent.</p>
<p class="lbl">STARTING WEIGHT</p>
<div class="weight"><b>172</b><div class="units"><span class="on">lb</span><span>kg</span></div></div>
<div class="spacer"></div>
<div class="btn">Continue</div>
</div></body></html>
